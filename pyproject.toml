[build-system]
requires = ["hatchling>=1.0"]
build-backend = "hatchling.build"

[tool.hatch.build]
source = "src"

[project]
name = "nextrec"
version = "0.0.0"
description = "CLI to automate facility booking on PerfectMind-based municipal sites (Oakland spike)."
requires-python = ">=3.9"
readme = "README.md"
authors = [ { name = "nextrec contributors" } ]
license = { text = "MIT" }

dependencies = [
  "playwright>=1.30",
  "typer[all]>=0.7",
  "rich>=13.0",
  "python-dateutil>=2.0",
  "pyyaml>=6.0",
  "textual>=8.0",
]
dev = [
  "pytest>=7.0",
  "textual-dev>=1.8",
]

[project.scripts]
nextrec = "nextrec.cli.main:app"
